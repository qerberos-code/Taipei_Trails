<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Taipei Trail Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one mobile column. Controls panel on top, ranked route cards below. Basin-and-ridge palette: mist ground, ridge green accent, MRT-orange for travel. */
:root{
  --bg:#eef2ee; --surface:#ffffff; --ink:#18241f; --muted:#5b6b64; --line:#d3ddd7;
  --accent:#1f6b4e; --accent-ink:#ffffff; --accent-soft:#dcebe3; --travel:#c25a12; --travel-soft:#fbe9dc;
  --warn:#9a6b00;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101714; --surface:#17211d; --ink:#e4ece7; --muted:#97a8a0; --line:#2a3832;
  --accent:#5cc49a; --accent-ink:#0c1612; --accent-soft:#1d3a2e; --travel:#f29a5c; --travel-soft:#3a2516; --warn:#e2b54a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101714; --surface:#17211d; --ink:#e4ece7; --muted:#97a8a0; --line:#2a3832;
  --accent:#5cc49a; --accent-ink:#0c1612; --accent-soft:#1d3a2e; --travel:#f29a5c; --travel-soft:#3a2516; --warn:#e2b54a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:18px}
html[lang="zh-Hant"] body,html[lang="zh-Hant"] .chip,html[lang="zh-Hant"] .btn,html[lang="zh-Hant"] select,html[lang="zh-Hant"] input,html[lang="zh-Hant"] .acts a{font-family:var(--f-zh)}
html[lang="zh-Hant"] header h1,html[lang="zh-Hant"] .ctop h3,html[lang="zh-Hant"] .summary h2{font-family:var(--f-zh);font-weight:700;letter-spacing:.02em}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface);flex:none}
.lang button{font:600 13px var(--f-body);border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
header h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:16px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 14px var(--f-body);border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
select,input[type=text]{width:100%;font:15px var(--f-body);padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.loc{display:grid;gap:8px}
.locline{display:flex;gap:8px}
.locline input{flex:1;min-width:0}
.btn{font:600 14px var(--f-body);padding:9px 14px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.6;cursor:progress}
.here{display:flex;align-items:center;gap:8px;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--travel-soft);color:var(--ink)}
.here b{font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--travel);flex:none}
.hint{font-size:13px;color:var(--muted);margin:0}
.msg{font-size:13px;color:var(--warn);margin:0}
.summary{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.summary h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0}
.summary span{color:var(--muted);font-size:13px}
.list{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.card.top{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ctop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ctop h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.2}
.zh{color:var(--muted);font-size:14px;font-weight:400;margin-left:4px}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:440px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{display:grid;gap:1px}
.stat small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat strong{font:500 17px var(--f-mono);font-variant-numeric:tabular-nums}
.stat.tr strong{color:var(--travel)}
.note{margin:0;font-size:14px;color:var(--muted)}
.plan{margin:0;font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts a{font:600 14px var(--f-body);text-decoration:none;padding:8px 13px;border-radius:10px;border:1px solid var(--accent)}
.acts a.go{background:var(--accent);color:var(--accent-ink)}
.acts a.info{color:var(--accent)}
.empty{padding:20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
footer{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease both}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>
</head><body>

<div class="wrap">
  <header>
    <div class="hrow">
      <h1 data-i18n="title">Taipei Trail Finder</h1>
      <div class="lang" role="group" aria-label="Language / 語言">
        <button id="lang-en" data-lang="en">EN</button>
        <button id="lang-zh" data-lang="zh">中文</button>
      </div>
    </div>
    <p data-i18n="intro">Tell it where you're staying and how much time you have. It picks runs and hikes that fit, nearest first.</p>
  </header>

  <section class="panel" aria-label="Your plan">
    <div class="loc">
      <p class="lbl" data-i18n="where">Where you are starting</p>
      <div class="here" id="here"><span class="dot"></span><span id="hereTxt"></span></div>
      <div class="locline">
        <input type="text" id="hotelQ" data-i18n-ph="hotelPh" placeholder="Hotel name, address, or paste a Google Maps link" autocomplete="off">
        <button class="btn" id="hotelBtn" data-i18n="set">Set</button>
      </div>
      <p class="msg" id="locMsg" hidden></p>
      <select id="station" aria-label="MRT station"></select>
    </div>

    <div>
      <p class="lbl" data-i18n="activity">Activity</p>
      <div class="chips" data-key="act">
        <button class="chip" data-v="run" data-i18n="run">Run</button>
        <button class="chip" data-v="hike" data-i18n="hike">Hike</button>
        <button class="chip" data-v="any" data-i18n="either">Either</button>
      </div>
    </div>

    <div class="row2">
      <div>
        <p class="lbl" data-i18n="distance">Distance</p>
        <div class="chips" data-key="dist">
          <button class="chip" data-v="3">3 km</button>
          <button class="chip" data-v="5">5 km</button>
          <button class="chip" data-v="10">10 km</button>
          <button class="chip" data-v="0" data-i18n="any">Any</button>
        </div>
      </div>
      <div>
        <p class="lbl" data-i18n="timeOn">Time on the trail</p>
        <div class="chips" data-key="time">
          <button class="chip" data-v="30" data-i18n="t30">30 min</button>
          <button class="chip" data-v="60" data-i18n="t60">1 hr</button>
          <button class="chip" data-v="120" data-i18n="t120">2 hr</button>
          <button class="chip" data-v="240" data-i18n="t240">Half day</button>
          <button class="chip" data-v="0" data-i18n="any">Any</button>
        </div>
      </div>
    </div>

    <div class="row2">
      <div>
        <p class="lbl" data-i18n="maxTravel">Max travel each way</p>
        <div class="chips" data-key="travel">
          <button class="chip" data-v="15" data-i18n="m15">15 min</button>
          <button class="chip" data-v="30" data-i18n="t30">30 min</button>
          <button class="chip" data-v="60" data-i18n="t60">1 hr</button>
          <button class="chip" data-v="0" data-i18n="any">Any</button>
        </div>
      </div>
      <div class="row2" style="gap:10px">
        <div>
          <p class="lbl" data-i18n="pace">Run pace</p>
          <select id="pace">
            <option value="5">5:00 /km</option><option value="5.5">5:30 /km</option>
            <option value="6">6:00 /km</option><option value="6.5">6:30 /km</option>
            <option value="7">7:00 /km</option><option value="8">8:00 /km</option>
          </select>
        </div>
        <div>
          <p class="lbl" data-i18n="hikeStyle">Hike style</p>
          <select id="hike">
            <option value="1.25" data-i18n="relaxed">Relaxed</option><option value="1" data-i18n="steady">Steady</option><option value="0.8" data-i18n="fast">Fast</option>
          </select>
        </div>
      </div>
    </div>
  </section>

  <section aria-live="polite">
    <div class="summary"><h2 id="sumTitle"></h2><span id="sumSub"></span></div>
    <div class="list" id="list" style="margin-top:10px"></div>
  </section>

  <footer data-i18n="footer"></footer>
</div>

 {n:"Qixing Mountain summit",zh:"七星山",t:"hike",lat:25.1810,lng:121.5480,km:5,gain:450,mrt:"Bus from Jiantan / Shilin",mrtZh:"劍潭站／士林站轉公車",note:"Taipei's highest peak (1,120 m). Volcanic vents and big views. Go early.",noteZh:"台北最高峰（1,120 公尺），有火山噴氣孔與壯闊視野，建議早點出發。"},
 {n:"Huangdi Dian ridge",zh:"皇帝殿",t:"hike",lat:24.9940,lng:121.6420,km:7,gain:450,mrt:"Bus from Muzha",mrtZh:"木柵轉公車",note:"Exposed rocky knife-edge ridge with chains. Experienced hikers, dry days only.",noteZh:"裸露岩稜需拉繩索，僅適合有經驗者於乾燥天氣前往。"}
];
const STATIONS=[
 ["Taipei Main Station","台北車站",25.0478,121.5170],["Ximen","西門",25.0420,121.5081],["Zhongshan","中山",25.0527,121.5203],["Shuanglian","雙連",25.0577,121.5206],
 ["Minquan W. Rd","民權西路",25.0626,121.5193],["Yuanshan","圓山",25.0713,121.5201],["Dongmen","東門",25.0339,121.5287],["Daan","大安",25.0330,121.5435],
 ["Zhongxiao Fuxing","忠孝復興",25.0416,121.5437],["Zhongxiao Dunhua","忠孝敦化",25.0414,121.5513],["Nanjing Fuxing","南京復興",25.0520,121.5441],["Songjiang Nanjing","松江南京",25.0520,121.5330],
 ["Xinyi Anhe","信義安和",25.0333,121.5527],["Taipei 101 / World Trade Center","台北101／世貿",25.0330,121.5637],["City Hall","市政府",25.0412,121.5651],["Songshan Airport","松山機場",25.0630,121.5519],
 ["Neihu","內湖",25.0837,121.5944],["Nangang","南港",25.0521,121.6070],["Gongguan","公館",25.0147,121.5343],["Beitou","北投",25.1318,121.4986],
 ["Tamsui","淡水",25.1678,121.4455],["Banqiao","板橋",25.0141,121.4630]
];
const S={lang:"en",act:"any",dist:"5",time:"60",travel:"30",pace:"6",hike:"1",origin:{st:13,lat:25.0330,lng:121.5637}};
try{const saved=JSON.parse(localStorage.getItem("ttf2")||"null");if(saved)Object.assign(S,saved)}catch(e){}
const save=()=>{try{localStorage.setItem("ttf2",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const L=()=>I18N[S.lang]||I18N.en;
const ZH=()=>S.lang==="zh";
$("pace").value=S.pace;$("hike").value=S.hike;

function hav(a,b,c,d){const R=6371,r=x=>x*Math.PI/180;const dl=r(c-a),dn=r(d-b);
  const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function travelMin(km){return Math.round(8+(km*1.35)/22*60)}
function fmt(m){const l=L();m=Math.round(m);if(m<60)return m+(ZH()?l.min:" min");const h=Math.floor(m/60),r=m%60;
  return ZH()?(h+l.h+(r?(" "+r+l.min):"")):(h+"h"+(r?(" "+String(r).padStart(2,"0")):""))}
const trim=x=>x.toFixed(1).replace(/\.0$/,"");
function canRun(t){return t.t==="run"||t.t==="both"}
function canHike(t){return t.t==="hike"||t.t==="both"}

function plan(t,mode){
  const l=L(),D=+S.dist,T=+S.time;let km=t.km,how;
  const perKm=mode==="run"?(+S.pace):15*(+S.hike);
  if(t.flex){
    if(D){if(D>t.flex)return null;km=D}
    else if(T){km=Math.min(t.flex,Math.max(2,Math.floor(T/perKm*2)/2))}
    how=t.km<3?l.laps(trim(km/t.km),t.km):l.outback(trim(km/2));
  }else{
    if(D&&(km<D*0.55||km>D*1.6))return null;
    how=l.full;
  }
  const mins=t.flex?km*perKm:(mode==="run"?km*(+S.pace)+t.gain/100*6:(km*15+t.gain/100*10)*(+S.hike));
  if(T&&mins>T*1.1)return null;
  let fit=0;if(D)fit+=Math.abs(km-D)/D;if(T)fit+=Math.max(0,(T-mins)/T)*0.5;
  return {km,mins,how,fit};
}

function originName(){const l=L(),o=S.origin;
  if(o.st!=null&&STATIONS[o.st])return STATIONS[o.st][ZH()?1:0]+l.mrtSuffix;
  if(o.custom)return o.custom+l.approx;
  return l.pinned}

function applyStatic(){
  const l=L();document.documentElement.lang=ZH()?"zh-Hant":"en";document.title=l.title;
  document.querySelectorAll("[data-i18n]").forEach(e=>{const v=l[e.dataset.i18n];if(typeof v==="string")e.textContent=v});
  document.querySelectorAll("[data-i18n-ph]").forEach(e=>e.placeholder=l[e.dataset.i18nPh]);
  ["en","zh"].forEach(k=>$("lang-"+k).setAttribute("aria-pressed",String(S.lang===k)));
  const sel=$("station"),cur=sel.value;sel.innerHTML="";
  const o0=document.createElement("option");o0.value="";o0.textContent=l.stationPick;sel.appendChild(o0);
  STATIONS.forEach((s,i)=>{const o=document.createElement("option");o.value=i;o.textContent=s[ZH()?1:0];sel.appendChild(o)});
  sel.value=cur;
}

function render(){
  const l=L();
  document.querySelectorAll(".chips").forEach(g=>{const k=g.dataset.key;
    g.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===S[k])))});
  const ht=$("hereTxt");ht.textContent="";const b=document.createElement("b");b.textContent=originName();ht.append(l.from,b);
  const o=S.origin,maxT=+S.travel,res=[];
  TRAILS.forEach(t=>{
    const modes=[];if((S.act==="run"||S.act==="any")&&canRun(t))modes.push("run");
    if((S.act==="hike"||S.act==="any")&&canHike(t))modes.push("hike");
    const d=hav(o.lat,o.lng,t.lat,t.lng),tr=travelMin(d);
    if(maxT&&tr>maxT)return;
    let best=null;modes.forEach(m=>{const p=plan(t,m);if(p&&(!best||p.fit<best.fit))best={...p,mode:m}});
    if(best)res.push({t,d,tr,...best});
  });
  res.sort((a,b)=>(a.tr+a.fit*25)-(b.tr+b.fit*25));
  const list=$("list");list.innerHTML="";
  const parts=[];if(+S.dist)parts.push(S.dist+" km");if(+S.time)parts.push(ZH()?l.onTrail+" "+fmt(+S.time):fmt(+S.time)+" "+l.onTrail);if(+S.travel)parts.push(l.away(S.travel));
  $("sumTitle").textContent=res.length?l.fit(res.length):l.nomatch;
  $("sumSub").textContent=parts.join(" · ");
  if(!res.length){const e=document.createElement("div");e.className="empty";e.textContent=l.empty;list.appendChild(e);return}
  res.slice(0,8).forEach((r,i)=>{
    const t=r.t,c=document.createElement("article");c.className="card"+(i===0?" top":"");
    const dest=`${t.lat},${t.lng}`,orig=`${o.lat},${o.lng}`;
    const nav=`https://www.google.com/maps/dir/?api=1&origin=${orig}&destination=${dest}&travelmode=transit`;
    const info=`https://www.google.com/search?q=${encodeURIComponent(ZH()?t.zh+" 步道":t.zh+" "+t.n+" trail")}`;
    const total=r.mins+r.tr*2;
    c.innerHTML=`<div class="ctop"><h3></h3><span class="badge">${i===0?l.top:""}${r.mode==="run"?l.run:l.hike}</span></div>
      <div class="stats">
        <div class="stat"><small>${l.sDist}</small><strong>${r.km.toFixed(1)} km</strong></div>
        <div class="stat"><small>${l.sClimb}</small><strong>${t.flex?0:t.gain} m</strong></div>
        <div class="stat"><small>${l.sOn}</small><strong>${fmt(r.mins)}</strong></div>
        <div class="stat tr"><small>${l.sTravel}</small><strong>${fmt(r.tr)}</strong></div>
      </div>
      <p class="plan"></p><p class="note"></p>
      <div class="acts"><a class="go" target="_blank" rel="noopener" href="${nav}">${l.nav}</a><a class="info" target="_blank" rel="noopener" href="${info}">${l.info}</a></div>`;
    const h=c.querySelector("h3");h.textContent=ZH()?t.zh:t.n;const z=document.createElement("span");z.className="zh";z.textContent=ZH()?t.n:t.zh;h.append(z);
    c.querySelector(".plan").textContent=l.planTxt(r.how,ZH()?t.mrtZh:t.mrt,fmt(total));
    c.querySelector(".note").textContent=ZH()?t.noteZh:t.note;
    list.appendChild(c);
  });
}
function setLang(k){S.lang=k;save();applyStatic();render();hideMsg()}

document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
document.querySelectorAll(".chips").forEach(g=>g.addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;S[g.dataset.key]=b.dataset.v;save();render()}));
$("pace").onchange=e=>{S.pace=e.target.value;save();render()};
$("hike").onchange=e=>{S.hike=e.target.value;save();render()};
$("station").onchange=e=>{if(e.target.value==="")return;const i=+e.target.value,s=STATIONS[i];
  S.origin={st:i,lat:s[2],lng:s[3]};hideMsg();save();render()};

function showMsg(t){const m=$("locMsg");m.textContent=t;m.hidden=false}
function hideMsg(){$("locMsg").hidden=true}

let samplerP=null;
function getSampler(){if(!samplerP)samplerP=(window.claude?.use?window.claude.use("sample"):Promise.resolve(null)).catch(()=>null);return samplerP}

async function setHotel(){
  const l=L(),q=$("hotelQ").value.trim();if(!q)return;hideMsg();
  const m=q.match(/@?(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{2,3}\.\d{3,})/);
  if(m){S.origin={lat:+m[1],lng:+m[2]};save();render();$("hotelQ").value="";$("station").value="";return}
  const btn=$("hotelBtn");btn.disabled=true;btn.textContent=l.finding;
  try{
    const sample=await getSampler();
    if(!sample){showMsg(l.noSample);return}
    const r=await sample.json(`You geocode places in the Taipei / New Taipei area of Taiwan. Place: "${q.replace(/"/g,"'")}". Reply with JSON only: {"found":boolean,"name":"short display name in ${ZH()?"Traditional Chinese":"English"}","lat":number,"lng":number}. Use your best knowledge of the hotel or address location. If you do not recognize it, return found:false.`,{modelTier:"quick"});
    if(r&&r.found&&isFinite(r.lat)&&isFinite(r.lng)&&r.lat>24.6&&r.lat<25.4&&r.lng>121.2&&r.lng<122.1){
      S.origin={custom:r.name||q,lat:+r.lat,lng:+r.lng};save();render();$("hotelQ").value="";$("station").value="";
    }else showMsg(l.notFound);
  }catch(e){showMsg(e&&e.code==="not_granted"?l.noPerm:l.fail)}
  finally{btn.disabled=false;btn.textContent=L().set}
}
$("hotelBtn").onclick=setHotel;
$("hotelQ").addEventListener("keydown",e=>{if(e.key==="Enter")setHotel()});
applyStatic();render();
</script>
</body></html>
